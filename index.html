function computeTreemapLayout(data, x, y, w, h) {
  if (!data.length || w <= 0 || h <= 0) return [];
  const total = data.reduce((s, d) => s + d.size, 0);
  if (total <= 0) return [];
  const rects = [];
  let cx = x, cy = y, cw = w, ch = h;
  let remaining = [...data];

  while (remaining.length > 0) {
    const isWide = cw >= ch;
    const side = isWide ? ch : cw;
    let best = [remaining[0]];
    let bestRatio = Infinity;

    for (let i = 1; i <= remaining.length; i++) {
      const slice = remaining.slice(0, i);
      const sliceTotal = slice.reduce((s, d) => s + d.size, 0);
      const sliceLen = (sliceTotal / total) * (cw * ch) / side;
      const worstRatio = Math.max(...slice.map(d => {
        const dimA = ((d.size / sliceTotal) * side);
        const dimB = sliceLen;
        return Math.max(dimB / dimA, dimA / dimB);
      }));
      if (worstRatio <= bestRatio) { bestRatio = worstRatio; best = slice; }
      else break;
    }

    const sliceTotal = best.reduce((s, d) => s + d.size, 0);
    const sliceLen = total > 0 ? (sliceTotal / total) * (isWide ? cw : ch) : 0;
    let offset = 0;
    for (const item of best) {
      const frac = sliceTotal > 0 ? item.size / sliceTotal : 0;
      const itemLen = frac * side;
      if (isWide) {
        rects.push({ ...item, x: cx, y: cy + offset, w: sliceLen, h: itemLen });
      } else {
        rects.push({ ...item, x: cx + offset, y: cy, w: itemLen, h: sliceLen });
      }
      offset += itemLen;
    }

    if (isWide) { cx += sliceLen; cw -= sliceLen; } else { cy += sliceLen; ch -= sliceLen; }
    remaining = remaining.slice(best.length);
  }
  return rects;
}

function OverviewTreemap({ rows, aggregations }) {
  const { hoveredLabel, setHoveredLabel } = useQuery();
  const aggLabels = { Count: "count", "Count Distinct": "count distinct", Sum: "sum (bytes)", Min: "min", Max: "max" };
  const agg = aggregations[0];
  const data = useMemo(() => [...rows].sort((a, b) => b.value - a.value).slice(0, 16).map(r => ({ name: r.label, size: r.value, color: r.color })), [rows]);
  const containerRef = useRef(null);
  const [dims, setDims] = useState({ w: 0, h: 0 });

  const setRef = useCallback(el => {
    containerRef.current = el;
    if (el) setDims({ w: el.offsetWidth, h: el.offsetHeight });
  }, []);

  const rects = useMemo(() => {
    if (dims.w <= 0 || dims.h <= 0) return [];
    return computeTreemapLayout(data, 0, 0, dims.w, dims.h);
  }, [data, dims]);

  return (
    <div style={{ display: "flex", flexDirection: "column", flex: 1, minHeight: 0, overflow: "hidden" }}>
      <div ref={setRef} style={{ flex: 1, padding: 4, minHeight: 0, position: "relative" }}>
        <svg width={dims.w} height={dims.h} style={{ display: "block" }}>
          {rects.map((r, i) => {
            const isHovered = hoveredLabel === r.name;
            const isDimmed = hoveredLabel && !isHovered;
            const pad = 2;
            return (
              <g key={i}
                onMouseEnter={() => setHoveredLabel(r.name)}
                onMouseLeave={() => setHoveredLabel(null)}
                style={{ cursor: "pointer" }}>
                <rect
                  x={r.x + pad} y={r.y + pad}
                  width={Math.max(0, r.w - pad * 2)} height={Math.max(0, r.h - pad * 2)}
                  rx={4} fill={r.color || T.primary}
                  fillOpacity={isDimmed ? 0.15 : isHovered ? 1 : 0.75}
                  style={{ transition: "fill-opacity 150ms" }}
                />
                {r.w > 50 && r.h > 26 && (
                  <text x={r.x + pad + 6} y={r.y + pad + 16} fill="#fff" fontSize={11} fontFamily={T.font} fontWeight={600} style={{ pointerEvents: "none" }}>
                    {r.name.length > Math.floor((r.w - 16) / 7) ? r.name.slice(0, Math.floor((r.w - 16) / 7)) + "..." : r.name}
                  </text>
                )}
                {r.w > 55 && r.h > 40 && (
                  <text x={r.x + pad + 6} y={r.y + pad + 30} fill="rgba(255,255,255,0.65)" fontSize={10} fontFamily={T.mono} style={{ pointerEvents: "none" }}>
                    {fmtNum(r.size)}
                  </text>
                )}
              </g>
            );
          })}
        </svg>
      </div>
      <div style={{ padding: "6px 12px", borderTop: `1px solid ${T.border}`, fontFamily: T.font, fontSize: T.textLabel, color: T.fgMuted, flexShrink: 0 }}>
        {rows.length} results . {aggLabels[agg] ?? agg}
      </div>
    </div>
  );
}

                <td style={{ ...tdStyle, borderRight: "none", maxWidth: 500, overflow: "hidden", textOverflow: "ellipsis" }} onContextMenu={e => onCellContext(e, row.template)}>{row.template}</td>
              </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <div style={{ padding: "6px 12px", borderTop: `1px solid ${T.border}`, fontFamily: T.font, fontSize: T.textLabel, color: T.fgMuted, flexShrink: 0 }}>
        {rows.length} templates
      </div>
      {menu && <CellContextMenu x={menu.x} y={menu.y} cellValue={menu.value} onClose={closeMenu} onAction={onAction} />}
    </div>
  );
}

      <div onScrollCapture={e => {

        {activeTab === "Overview" ? (
          overviewViz === "table" ? (
            <OverviewTable rows={tableData} groupBys={groupBys} aggregations={aggregations} />
          ) : overviewViz === "hbar" ? (
            <OverviewHBar rows={tableData} groupBys={groupBys} aggregations={aggregations} />
          ) : overviewViz === "donut" ? (
            <OverviewDonut rows={tableData} aggregations={aggregations} />
          ) : overviewViz === "treemap" ? (
            <OverviewTreemap rows={tableData} aggregations={aggregations} />
          ) : (
            <OverviewTable rows={tableData} groupBys={groupBys} aggregations={aggregations} />
          )
        ) : activeTab === "Spans" ? (
          <SpansTableSimple groupBys={groupBys} />
        ) : activeTab === "Traces" ? (
          <TracesTable groupBys={groupBys} />
        ) : activeTab === "Flows" ? (
          <DependencyMap />
        ) : activeTab === "Logs" ? (
          <LogsTable groupBys={groupBys} />

          <TemplatesTable groupBys={groupBys} />

          <TabPlaceholder tab={activeTab} />

      </div>
    </div>
  );

                borderRadius: "6px 6px 0 0", cursor: "pointer", userSelect: "none",
                backgroundColor: isActive ? T.card : "transparent",
                borderTop: isActive ? `2px solid ${T.primary}` : "2px solid transparent",
                borderLeft: isActive ? `1px solid ${T.border}` : "1px solid transparent",
                borderRight: isActive ? `1px solid ${T.border}` : "1px solid transparent",
                borderBottom: isActive ? `1px solid ${T.card}` : "1px solid transparent",
                marginBottom: -1, transition: "background-color 80ms",
                minWidth: 0,
              }}
              onMouseEnter={e => { if (!isActive) e.currentTarget.style.backgroundColor = T.muted; }}
              onMouseLeave={e => { if (!isActive) e.currentTarget.style.backgroundColor = isActive ? T.card : "transparent"; }}
            >
              {/* Data type icon */}
              {tab.dataType === "Spans" ? (
                <svg width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M2 7h10M5 4l-3 3 3 3M9 4l3 3-3 3" stroke="#67e8f9" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
              ) : tab.dataType === "Logs" ? (
                <svg width="12" height="12" viewBox="0 0 14 14" fill="none"><rect x="2" y="2" width="10" height="2" rx="1" fill="#a78bfa"/><rect x="2" y="6" width="10" height="2" rx="1" fill="#a78bfa" opacity="0.6"/><rect x="2" y="10" width="7" height="2" rx="1" fill="#a78bfa" opacity="0.3"/></svg>
              ) : (
                <div style={{ width: 12, height: 12, borderRadius: "50%", backgroundColor: T.fgMuted, opacity: 0.3 }} />
              )}
              <span style={{
                fontFamily: T.font, fontSize: 12, fontWeight: isActive ? 600 : 400,
                color: isActive ? T.fg : T.fgMuted,
                overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", maxWidth: 120,
              }}>
                {tab.label}
              </span>
              {/* Close button */}
              {exploreTabs.length > 1 && (
                <div onClick={e => { e.stopPropagation(); onCloseTab(tab.id); }}
                  style={{ width: 16, height: 16, display: "flex", alignItems: "center", justifyContent: "center", borderRadius: 3, color: T.fgMuted, flexShrink: 0 }}
                  onMouseEnter={e => e.currentTarget.style.backgroundColor = "rgba(255,255,255,0.1)"}
                  onMouseLeave={e => e.currentTarget.style.backgroundColor = "transparent"}>
                  <X size={10} />
                </div>
              )}
            </div>
          );
        })}
        {/* Add tab button */}
        <div onClick={onAddTab}
          style={{
            display: "flex", alignItems: "center", justifyContent: "center",
            width: 28, height: 28, borderRadius: "6px 6px 0 0", cursor: "pointer",
            color: T.fgMuted, transition: "background-color 80ms",
          }}
          onMouseEnter={e => e.currentTarget.style.backgroundColor = T.muted}
          onMouseLeave={e => e.currentTarget.style.backgroundColor = "transparent"}>
          <Plus size={14} />
        </div>
      </div>
    </div>
  );
}

let nextTabId = 2;
let nextExploreNum = 1;
function App() {
  const [exploreTabs, setExploreTabs] = useState([
    { id: 1, label: "Spans query", dataType: "Spans", isNew: false },
  ]);
  const [activeTabId, setActiveTabId] = useState(1);

  const addTab = () => {
    const id = nextTabId++;
    const num = nextExploreNum++;
    setExploreTabs(prev => [...prev, { id, label: `Explore ${num}`, dataType: null, isNew: true }]);
    setActiveTabId(id);
  };

  const closeTab = (id) => {
    setExploreTabs(prev => {
      const next = prev.filter(t => t.id !== id);
      if (next.length === 0) return prev;
      if (activeTabId === id) setActiveTabId(next[next.length - 1].id);
      return next;
    });
  };

  const activatePreset = (tabId, dataType, preset) => {
    setExploreTabs(prev => prev.map(t =>
      t.id === tabId ? {
        ...t,
        dataType,
        label: preset ? preset.title : `${dataType} query`,
        isNew: false,
        pendingDataType: null,
        presetGroupBys: preset?.groupBys ?? ["serviceName"],
        presetAggs: preset?.aggs ?? ["Count"],
        presetFilters: preset?.filters ?? [],
        focusTab: preset?.focusTab ?? "Overview",
      } : t
    ));
  };

  const switchDataType = (newDataType) => {
    const defaults = newDataType === "Logs"
      ? { groupBys: ["level"], aggs: ["Count"], filters: [], focusTab: "Logs" }
      : { groupBys: ["serviceName"], aggs: ["Count"], filters: [], focusTab: "Spans" };
    setExploreTabs(prev => prev.map(t =>
      t.id === activeTabId ? {
        ...t,
        dataType: newDataType,
        label: `${newDataType} query`,
        isNew: false,
        pendingDataType: null,
        presetGroupBys: defaults.groupBys,
        presetAggs: defaults.aggs,
        presetFilters: defaults.filters,
        focusTab: defaults.focusTab,
      } : t
    ));
  };

  const activeTab = exploreTabs.find(t => t.id === activeTabId);

  return (
    <div style={{ display: "flex", height: "100vh", backgroundColor: T.bg, fontFamily: T.font, color: T.fg, overflow: "hidden" }}>
      <SideNav />
      <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
        <PageHeader
          exploreTabs={exploreTabs}
          activeTabId={activeTabId}
          onSelectTab={setActiveTabId}
          onAddTab={addTab}
          onCloseTab={closeTab}
        />
        {activeTab?.isNew ? (
          <ZeroState
            onSelectPreset={(dataType, preset) => activatePreset(activeTabId, dataType, preset)}
            pendingDataType={activeTab?.pendingDataType ?? null}
            onSwitchDataType={switchDataType}
          />
        ) : (
          <QueryDataProvider
            key={`${activeTabId}-${activeTab?.dataType}`}
            initialDataType={activeTab?.dataType ?? "Spans"}
            initialGroupBys={activeTab?.presetGroupBys}
            initialAggs={activeTab?.presetAggs}
            initialFilters={activeTab?.presetFilters}
            initialFocusTab={activeTab?.focusTab}
            onSwitchDataType={switchDataType}
          >
            <WorkspaceContent />
          </QueryDataProvider>
        )}
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
