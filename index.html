function getTableData(groupBy, aggregation) {
  const base = groupBy === "serviceName" ? SERVICE_NAME_ROWS : groupBy === "level" ? LEVEL_ROWS : SUBSYSTEM_ROWS;
  if (aggregation === "Count") return base;
  if (aggregation === "Count Distinct") return base.map(r => ({ ...r, value: Math.round(r.value * 0.4 + r.rank * 17) }));
  if (aggregation === "Sum") return base.map(r => ({ ...r, value: Math.round(r.value * (1100 + (r.rank * 137) % 900)) }));
  if (aggregation === "Min") return base.map(r => ({ ...r, value: Math.max(1, Math.round(r.value * 0.01 + r.rank * 3)) }));
  if (aggregation === "Max") return base.map(r => ({ ...r, value: Math.round(r.value * 2.3 + r.rank * 1000) }));
  return base;
}

const MULTI_GB_LABELS = {
  serviceName: ["checkoutservice", "currencyservice", "cartservice", "paymentservice", "adservice", "shippingservice", "emailservice", "recommendationservice"],
  level: ["INFO", "ERROR", "WARN", "DEBUG", "TRACE", "CRITICAL"],
  subsystem: ["api-gateway", "database", "auth", "cache", "messaging", "scheduler"],
};
const MULTI_GB_COLORS = ["#5a8cf8", "#ef4d7b", "#f97316", "#216def", "#9949db", "#22c4a0", "#3cc48f", "#fb923c", "#fec52d", "#a78bfa", "#dc2626", "#6b7280"];

function getMultiGroupTableData(groupBys, aggregation) {
  if (groupBys.length <= 1) {
    const primary = groupBys[0] ?? "serviceName";
    return getTableData(primary, aggregation).map(r => ({ ...r, fields: { [primary]: r.label } }));
  }
  const primary = groupBys[0];
  const primaryLabels = MULTI_GB_LABELS[primary] ?? MULTI_GB_LABELS.serviceName;
  const secondaryFields = groupBys.slice(1);
  const rows = [];
  const rand = makeRand(42);
  let rank = 0;
  for (let pi = 0; pi < primaryLabels.length && rows.length < 24; pi++) {
    const combosPerPrimary = Math.min(3, secondaryFields.reduce((n, f) => n * (MULTI_GB_LABELS[f]?.length ?? 3), 1));
    for (let ci = 0; ci < combosPerPrimary && rows.length < 24; ci++) {
      rank++;
      const fields = { [primary]: primaryLabels[pi] };
      secondaryFields.forEach((f, fi) => {
        const opts = MULTI_GB_LABELS[f] ?? ["unknown"];
        fields[f] = opts[(pi + ci + fi * 3) % opts.length];
      });
      const baseVal = Math.round(500000 * rand() + 1000);
      let value = baseVal;
      if (aggregation === "Sum") value = Math.round(baseVal * (1100 + (rank * 137) % 900));
      else if (aggregation === "Count Distinct") value = Math.round(baseVal * 0.4 + rank * 17);
      else if (aggregation === "Min") value = Math.max(1, Math.round(baseVal * 0.01 + rank * 3));
      else if (aggregation === "Max") value = Math.round(baseVal * 2.3 + rank * 1000);
      rows.push({
        rank,
        label: Object.values(fields).join(" . "),
        value,
        color: MULTI_GB_COLORS[(pi + ci) % MULTI_GB_COLORS.length],
        fields,
      });
    }
  }
  return rows;
}

function getChartSeries(groupBys, aggregation) {
  const rows = getMultiGroupTableData(groupBys, aggregation);
  return [...rows].sort((a, b) => b.value - a.value).slice(0, 6).map((r, i) => ({ key: `s${i}`, label: r.label, color: r.color, total: r.value }));
}

function makeRand(seed) { let s = seed; return () => { s = ((s * 1103515245) + 12345) & 0x7fffffff; return s / 0x7fffffff; }; }

function buildChartBuckets(series) {
  const rand = makeRand(271828);
  const maxTotal = Math.max(...series.map(s => s.total), 1);
  return Array.from({ length: 48 }, (_, i) => {
    const totalMins = i * 30;
    const hour = (16 + Math.floor(totalMins / 60)) % 24;
    const min = totalMins % 60;
    const label = min === 0 ? `${String(hour).padStart(2, "0")}:00` : "";
    const t = i / 47;
    const shape = 0.45 + 0.55 * Math.sin(t * Math.PI * 2.1 + 0.5) + 0.1 * Math.sin(t * Math.PI * 8.0);
    const bucket = { index: i, label };
    series.forEach(s => {
      bucket[s.key] = Math.max(1, Math.round((s.total / maxTotal) * 900000 * shape * (0.88 + rand() * 0.24)));
    });
    return bucket;
  });
}

const QueryCtx = createContext(null);

function QueryDataProvider({ children, initialDataType = "Spans", onSwitchDataType, isEmpty = false, initialGroupBys, initialAggs, initialFilters, onRun, initialFocusTab }) {
  const [groupBys, setGroupBys] = useState(isEmpty ? [] : (initialGroupBys ?? ["serviceName"]));
  const [aggregations, setAggregations] = useState(isEmpty ? [] : (initialAggs ?? ["Count"]));
  const [dataType, setDataType] = useState(initialDataType || null);

  const groupBy = groupBys[0] ?? "serviceName";
  const aggregation = aggregations[0] ?? "Count";

  const setGroupBy = (v) => setGroupBys(prev => [v, ...prev.filter(g => g !== v).slice(0, prev.length - 1)]);
  const addGroupBy = (v) => setGroupBys(prev => prev.includes(v) ? prev : [...prev, v]);
  const removeGroupBy = (v) => setGroupBys(prev => prev.filter(g => g !== v));

  const setAggregation = (v) => setAggregations(prev => [v, ...prev.slice(1)]);
  const addAggregation = (v) => setAggregations(prev => prev.includes(v) ? prev : [...prev, v]);
  const removeAggregation = (v) => setAggregations(prev => prev.filter(a => a !== v));
  const ensureMinAggregation = useCallback(() => {
    setAggregations(prev => prev.length === 0 ? ["Count"] : prev);
  }, []);

  const chartsData = useMemo(() => aggregations.map(agg => {
    const series = getChartSeries(groupBys, agg);
    const buckets = buildChartBuckets(series);
    return { aggregation: agg, series, buckets };
  }), [groupBys, aggregations]);

  const tableData = useMemo(() => getMultiGroupTableData(groupBys, aggregation), [groupBys, aggregation]);

  const multiAggTableData = useMemo(() => {
    if (aggregations.length <= 1) return tableData;
    return tableData.map(row => {
      const aggValues = {};
      aggregations.forEach(agg => {
        const multipliers = { Count: 1, "Count Distinct": 0.4, Sum: 1200, Min: 0.01, Max: 2.3 };
        aggValues[agg] = Math.round(row.value * (multipliers[agg] ?? 1) + row.rank * ((agg.length * 7) % 50));
      });
      return { ...row, aggValues };
    });
  }, [tableData, aggregations]);

  const chartSeries = chartsData[0]?.series ?? [];
  const chartBuckets = chartsData[0]?.buckets ?? [];

  const [hoveredLabel, setHoveredLabel] = useState(null);
  const [hoveredBucketIdx, setHoveredBucketIdx] = useState(null);
  const [queryText, setQueryText] = useState("");
  const [queryFilters, setQueryFilters] = useState(() =>
    (initialFilters ?? []).map((f, i) => ({ ...f, id: Date.now() + i }))
  );

  const addFilter = useCallback((value, type) => {
    setQueryFilters(prev => {
      const exists = prev.find(f => f.value === String(value) && f.type === type);
      if (exists) return prev;
      return [...prev, { value: String(value), type, id: Date.now() }];
    });
  }, []);
  const removeFilter = useCallback((id) => {
    setQueryFilters(prev => prev.filter(f => f.id !== id));
  }, []);

  return (
    <QueryCtx.Provider value={{
      groupBys, groupBy, setGroupBy, addGroupBy, removeGroupBy,
      aggregation, aggregations, setAggregation, addAggregation, removeAggregation, ensureMinAggregation,
      tableData: multiAggTableData, chartSeries, chartBuckets, chartsData,
      hoveredLabel, setHoveredLabel, hoveredBucketIdx, setHoveredBucketIdx,
      dataType, setDataType, onSwitchDataType, onRun,
      queryText, setQueryText, queryFilters, addFilter, removeFilter, initialFocusTab,
    }}>
      {children}
    </QueryCtx.Provider>
  );
}

function useQuery() { return useContext(QueryCtx); }

function fmtNum(n) {
  if (n >= 1_000_000) return `${(n / 1_000_000).toFixed(1)}M`;
  if (n >= 1_000) return `${Math.round(n / 1_000)}k`;
  return String(n);
}

  const { groupBys, groupBy, setGroupBy, addGroupBy, removeGroupBy, aggregations, setAggregation, addAggregation, removeAggregation, ensureMinAggregation, dataType, setDataType, onSwitchDataType, onRun, queryText, setQueryText, queryFilters, removeFilter } = useQuery();

  const [dataTypeOpen, setDataTypeOpen] = useState(false);
  const [acOpen, setAcOpen] = useState(false);
  const [acIndex, setAcIndex] = useState(0);
  const inputRef = useRef(null);

  const AC_SUGGESTIONS = useMemo(() => {
    const common = [
      { label: "serviceName", type: "field", desc: "Service name" },
      { label: "operationName", type: "field", desc: "Operation / endpoint" },
      { label: "status_code", type: "field", desc: "HTTP status code" },
      { label: "duration", type: "field", desc: "Span duration (ms)" },
      { label: "level", type: "field", desc: "Log severity level" },
      { label: "subsystem", type: "field", desc: "Application subsystem" },
      { label: "region", type: "field", desc: "Deployment region" },
      { label: "= 'checkoutservice'", type: "value", desc: "Filter by service" },
      { label: "= 'frontend'", type: "value", desc: "Filter by service" },
      { label: "= 'paymentservice'", type: "value", desc: "Filter by service" },
      { label: "> 500", type: "operator", desc: "Greater than 500" },
      { label: "= 200", type: "operator", desc: "Status OK" },
      { label: "= 500", type: "operator", desc: "Status Error" },
      { label: "!= 'debug'", type: "operator", desc: "Exclude debug" },
      { label: "AND", type: "keyword", desc: "Logical AND" },
      { label: "OR", type: "keyword", desc: "Logical OR" },
      { label: "NOT", type: "keyword", desc: "Logical NOT" },
      { label: "CONTAINS", type: "keyword", desc: "String contains" },
      { label: "IN", type: "keyword", desc: "Value in set" },
    ];
    if (!queryText.trim()) return [];
    const q = queryText.toLowerCase().split(/\s+/).pop() || "";
    if (!q) return [];
    return common.filter(s => s.label.toLowerCase().includes(q)).slice(0, 7);
  }, [queryText]);

  const applyAc = (suggestion) => {
    const words = queryText.split(/\s+/);
    words.pop();
    words.push(suggestion.label);
    setQueryText(words.join(" ") + " ");
    setAcOpen(false);
    setAcIndex(0);
    inputRef.current?.focus();
  };
  const cycleGroupBy = () => {
    const idx = GROUP_BY_OPTIONS.indexOf(groupBy);
    setGroupBy(GROUP_BY_OPTIONS[(idx + 1) % GROUP_BY_OPTIONS.length]);
  };
  const handleAddGroupBy = () => {
    const next = GROUP_BY_OPTIONS.find(o => !groupBys.includes(o));
    if (next) addGroupBy(next);
  };
  const canAddMore = groupBys.length < GROUP_BY_OPTIONS.length;
  const cyclePrimaryAgg = () => {
    const idx = AGGREGATION_OPTIONS.indexOf(aggregations[0]);
    setAggregation(AGGREGATION_OPTIONS[(idx + 1) % AGGREGATION_OPTIONS.length]);
  };
  const handleAddAgg = () => {
    const next = AGGREGATION_OPTIONS.find(o => !aggregations.includes(o));
    if (next) addAggregation(next);
  };
  const canAddMoreAgg = aggregations.length < AGGREGATION_OPTIONS.length;

  const chipStyle = { display: "flex", alignItems: "center", height: 24, padding: "0 4px 0 8px", borderRadius: 4, fontSize: T.textP, fontFamily: T.font, fontWeight: 500, cursor: "pointer", userSelect: "none", gap: 4 };

              <span style={{ fontSize: T.textP, fontWeight: 700, color: T.fgMuted, fontFamily: T.font }}>DataPrime</span>
            </div>
          </div>
          {/* Data type selector */}
          <div style={{ position: "relative" }} onMouseLeave={() => setDataTypeOpen(false)}>

              ) : dataType === "Logs" ? (

              ) : null}

          {/* Aggregation */}
          <div style={{ display: "flex", alignItems: "center", backgroundColor: T.card, border: `1px solid ${T.border}`, borderRadius: T.radius, padding: "4px 6px 4px 10px", gap: 4 }}>
            <span style={{ fontSize: T.textLabel, color: T.fgMuted, fontFamily: T.font, marginRight: 2 }}>Aggregation</span>
            {aggregations.length === 0 && (
              <span style={{ fontSize: T.textLabel, color: T.fgMuted, fontFamily: T.font, fontStyle: "italic", opacity: 0.5 }}>Count (on run)</span>
            )}
            {aggregations.map((agg, i) => (
              <div key={agg} style={{ ...chipStyle, backgroundColor: "rgba(30,111,129,0.12)", color: "#67e8f9" }}>
                <span
                  onClick={() => { if (i === 0) cyclePrimaryAgg(); }}
                  title={i === 0 ? "Click to change primary aggregation" : agg}
                  style={{ cursor: i === 0 ? "pointer" : "default", minWidth: 30 }}
                >
                  {agg}
                </span>
                <div onClick={() => removeAggregation(agg)} style={{ display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", width: 16, height: 16, borderRadius: 3 }}

                  onMouseLeave={e => e.currentTarget.style.backgroundColor = "transparent"}>
                  <X size={10} />
                </div>
              </div>
            ))}
            {canAddMoreAgg && (
              <div onClick={handleAddAgg} title="Add aggregation" style={{ width: 24, height: 24, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", borderRadius: 4, color: T.fgMuted }}

                onMouseLeave={e => e.currentTarget.style.backgroundColor = "transparent"}>
                <Plus size={12} />
              </div>
            )}
          </div>
        </div>
        <div onClick={() => { ensureMinAggregation(); if (onRun) onRun(); }} style={{ display: "flex", alignItems: "center", backgroundColor: "#02763a", borderRadius: T.radius, height: 32, padding: "0 12px", gap: 4, cursor: "pointer" }}>
          <Play size={12} fill="#fff" color="#fff" />
          <span style={{ fontSize: T.textP, fontWeight: 700, color: "#fff", fontFamily: T.font }}>Run</span>
        </div>
      </div>
    </div>
  );
}

function SingleChart({ chartSeries, chartBuckets, aggregationLabel, compact = false, panelH = 240 }) {
  const [chartType, setChartType] = useState("stackedbar");
  const [menuOpen, setMenuOpen] = useState(false);
  const [showLegend, setShowLegend] = useState(false);
  const { hoveredLabel, setHoveredLabel, hoveredBucketIdx, setHoveredBucketIdx, addFilter, dataType, aggregations } = useQuery();
  const [chartMenu, setChartMenu] = useState(null);
  const isLogs = dataType === "Logs";
  const isCountOnly = aggregations.length === 0 || (aggregations.length === 1 && aggregations[0] === "Count");
  const [severityMode, setSeverityMode] = useState(false);
  const chartH = Math.max(40, panelH - 38);
  const chartIdRef = useRef(Math.random().toString(36).slice(2, 8));
  const [localHover, setLocalHover] = useState(false);

  const SEV_COLORS = { Debug: "#9ca3af", Info: "#60a5fa", Warning: "#fbbf24", Error: "#f87171" };
  const SEVS = ["Debug", "Info", "Warning", "Error"];

  // Generate severity-split data from existing buckets
  const severityBuckets = useMemo(() => {
    if (!severityMode) return null;
    const rand = makeRand(321);
    return chartBuckets.map(b => {
      let total = 0;
      chartSeries.forEach(s => { total += (b[s.key] ?? 0); });
      return {
        ...b,
        _sev_Debug: Math.round(total * (0.42 + rand() * 0.06)),
        _sev_Info: Math.round(total * (0.33 + rand() * 0.05)),
        _sev_Warning: Math.round(total * (0.14 + rand() * 0.03)),
        _sev_Error: Math.round(total * (0.07 + rand() * 0.02)),
      };
    });
  }, [severityMode, chartBuckets, chartSeries]);

  const yMax = useMemo(() => {
    let max = 0;
    if (chartType === "groupedbar") {
      for (const b of chartBuckets) { for (const s of chartSeries) { const v = b[s.key] ?? 0; if (v > max) max = v; } }
    } else {
      for (const b of chartBuckets) { let sum = 0; for (const s of chartSeries) sum += (b[s.key] ?? 0); if (sum > max) max = sum; }
    }
    const mag = Math.pow(10, Math.floor(Math.log10(max || 1)));
    return Math.ceil(max / mag) * mag;
  }, [chartBuckets, chartSeries, chartType]);

  const yTicks = useMemo(() => Array.from({ length: 5 }, (_, i) => Math.round((yMax / 4) * i)), [yMax]);
  const legendSeries = useMemo(() => [...chartSeries].reverse(), [chartSeries]);
  const tooltipRenderer = useCallback(props => <ChartTooltipContent {...props} buckets={chartBuckets} series={chartSeries} />, [chartBuckets, chartSeries]);
  const activeChartType = CHART_TYPES.find(ct => ct.id === chartType);

  const seriesOpacity = (label) => !hoveredLabel ? 1 : (hoveredLabel === label ? 1 : 0.15);

  const xTickIndices = useMemo(() => {
    const indices = [];
    chartBuckets.forEach((b, i) => { if (b.label) indices.push(i); });
    if (compact && indices.length > 6) return indices.filter((_, i) => i % 2 === 0);
    return indices;
  }, [chartBuckets, compact]);

  const xTick = (props) => {
    const idx = props.payload.value;
    const bucket = chartBuckets[idx];
    if (!bucket?.label) return null;
    if (!xTickIndices.includes(idx)) return null;
    return <g transform={`translate(${props.x},${props.y})`}><text x={0} y={0} dy={12} textAnchor="middle" fill={T.fgMuted} fontSize={compact ? 9 : 10} fontFamily={T.font}>{bucket.label}</text></g>;
  };

  const onChartMouseMove = useCallback((state) => {
    if (state && state.activeTooltipIndex != null) {
      setLocalHover(true);
      setHoveredBucketIdx(state.activeTooltipIndex);
    }
  }, [setHoveredBucketIdx]);

  const onChartMouseLeave = useCallback(() => {
    setLocalHover(false);
    setHoveredLabel(null);
    setHoveredBucketIdx(null);
  }, [setHoveredLabel, setHoveredBucketIdx]);

  // Show sync cursor line when another chart is hovered (not this one)
  const showSyncCursor = !localHover && hoveredBucketIdx != null;

  const renderChart = () => {
    const commonXY = { xAxis: { dataKey: "index", interval: 0, tick: xTick, axisLine: false, tickLine: false, tickSize: 0 }, yAxis: { tickFormatter: fmtNum, tick: { fontFamily: T.font, fontSize: compact ? 9 : 10, fill: T.fgMuted }, axisLine: false, tickLine: false, width: compact ? 36 : 44, ticks: yTicks } };

    // Sync cursor reference line - only shown when another chart is hovered
    const syncLine = showSyncCursor ? <ReferenceLine x={hoveredBucketIdx} stroke={T.fgMuted} strokeDasharray="3 3" strokeOpacity={0.6} /> : null;

    if (severityMode && severityBuckets) {
      return <ResponsiveContainer width="100%" height={chartH}><BarChart data={severityBuckets} margin={{ top: 6, right: 4, bottom: 22, left: 0 }} barCategoryGap="2%" onMouseMove={onChartMouseMove} onMouseLeave={onChartMouseLeave}><CartesianGrid vertical={false} stroke="#3a3a4a" strokeOpacity={0.5} /><XAxis {...commonXY.xAxis} /><YAxis {...commonXY.yAxis} /><Tooltip contentStyle={{ backgroundColor: T.card, border: `1px solid ${T.border}`, borderRadius: 6, fontFamily: T.font, fontSize: 11, color: T.fg }} formatter={(v, name) => [fmtNum(v), name.replace("_sev_", "")]} labelFormatter={i => severityBuckets[i]?.label || ""} cursor={{ fill: T.muted, opacity: 0.25 }} />{syncLine}{SEVS.map(s => <Bar key={s} dataKey={`_sev_${s}`} name={s} stackId="severity" fill={SEV_COLORS[s]} isAnimationActive={false} />)}</BarChart></ResponsiveContainer>;
    }

    if (chartType === "line") return <ResponsiveContainer width="100%" height={chartH}><LineChart data={chartBuckets} margin={{ top: 6, right: 4, bottom: 22, left: 0 }} onMouseMove={onChartMouseMove} onMouseLeave={onChartMouseLeave}><CartesianGrid vertical={false} stroke="#3a3a4a" strokeOpacity={0.5} /><XAxis {...commonXY.xAxis} /><YAxis {...commonXY.yAxis} /><Tooltip content={tooltipRenderer} cursor={{ stroke: T.fgMuted, strokeDasharray: "3 3" }} />{syncLine}{chartSeries.map(s => <Line key={s.key} type="monotone" dataKey={s.key} stroke={s.color} strokeWidth={hoveredLabel === s.label ? 3 : 1.5} strokeOpacity={seriesOpacity(s.label)} dot={false} isAnimationActive={false} onMouseEnter={() => setHoveredLabel(s.label)} />)}</LineChart></ResponsiveContainer>;
    if (chartType === "area") return <ResponsiveContainer width="100%" height={chartH}><AreaChart data={chartBuckets} margin={{ top: 6, right: 4, bottom: 22, left: 0 }} onMouseMove={onChartMouseMove} onMouseLeave={onChartMouseLeave}><CartesianGrid vertical={false} stroke="#3a3a4a" strokeOpacity={0.5} /><XAxis {...commonXY.xAxis} /><YAxis {...commonXY.yAxis} /><Tooltip content={tooltipRenderer} cursor={{ stroke: T.fgMuted, strokeDasharray: "3 3" }} />{syncLine}{chartSeries.map(s => <Area key={s.key} type="monotone" dataKey={s.key} stackId="stack" stroke={s.color} fill={s.color} fillOpacity={seriesOpacity(s.label) * 0.3} strokeOpacity={seriesOpacity(s.label)} strokeWidth={1.5} isAnimationActive={false} onMouseEnter={() => setHoveredLabel(s.label)} />)}</AreaChart></ResponsiveContainer>;
    if (chartType === "groupedbar") return <ResponsiveContainer width="100%" height={chartH}><BarChart data={chartBuckets} margin={{ top: 6, right: 4, bottom: 22, left: 0 }} barCategoryGap="15%" onMouseMove={onChartMouseMove} onMouseLeave={onChartMouseLeave}><CartesianGrid vertical={false} stroke="#3a3a4a" strokeOpacity={0.5} /><XAxis {...commonXY.xAxis} /><YAxis {...commonXY.yAxis} /><Tooltip content={tooltipRenderer} cursor={{ fill: T.muted, opacity: 0.25 }} />{syncLine}{chartSeries.map(s => <Bar key={s.key} dataKey={s.key} fill={s.color} fillOpacity={seriesOpacity(s.label)} isAnimationActive={false} onMouseEnter={() => setHoveredLabel(s.label)} />)}</BarChart></ResponsiveContainer>;
    return <ResponsiveContainer width="100%" height={chartH}><BarChart data={chartBuckets} margin={{ top: 6, right: 4, bottom: 22, left: 0 }} barCategoryGap="2%" onMouseMove={onChartMouseMove} onMouseLeave={onChartMouseLeave}><CartesianGrid vertical={false} stroke="#3a3a4a" strokeOpacity={0.5} /><XAxis {...commonXY.xAxis} /><YAxis {...commonXY.yAxis} /><Tooltip content={tooltipRenderer} cursor={{ fill: T.muted, opacity: 0.25 }} />{syncLine}{chartSeries.map(s => <Bar key={s.key} dataKey={s.key} stackId="stack" fill={s.color} fillOpacity={seriesOpacity(s.label)} isAnimationActive={false} onMouseEnter={() => setHoveredLabel(s.label)} />)}</BarChart></ResponsiveContainer>;
  };

  const menuItemStyle = { display: "flex", alignItems: "center", gap: 8, padding: "7px 12px", cursor: "pointer", fontFamily: T.font, fontSize: T.textP, color: T.fg, transition: "background-color 80ms" };

  return (
    <div style={{ display: "flex", flexDirection: "column", width: "100%", height: "100%", minWidth: 0, backgroundColor: T.card, border: `1px solid ${T.border}`, borderRadius: T.radius, position: "relative" }}>
      {/* Header */}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 12px", height: 36, minHeight: 36, borderBottom: `1px solid ${T.border}`, flexShrink: 0 }}>
        <span style={{ fontFamily: T.font, fontSize: T.textP, fontWeight: 600, color: T.fg, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{aggregationLabel}</span>
        <div style={{ display: "flex", gap: 4, alignItems: "center", flexShrink: 0 }}>
          {/* Severity toggle - Logs + Count only */}
          {isLogs && isCountOnly && (
            <div
              onClick={() => setSeverityMode(s => !s)}
              style={{
                display: "flex", alignItems: "center", gap: 4, height: 22, padding: "0 6px",
                borderRadius: 4, cursor: "pointer",
                backgroundColor: severityMode ? "rgba(96,165,250,0.12)" : "transparent",
                border: `1px solid ${severityMode ? "#60a5fa" : T.border}`,

              <div style={{ display: "flex", gap: 1.5, alignItems: "flex-end", height: 10 }}>
                <span style={{ width: 2.5, height: 4, borderRadius: 0.5, backgroundColor: severityMode ? SEV_COLORS.Debug : T.fgMuted, transition: "background-color 150ms" }} />
                <span style={{ width: 2.5, height: 6, borderRadius: 0.5, backgroundColor: severityMode ? SEV_COLORS.Info : T.fgMuted, transition: "background-color 150ms" }} />
                <span style={{ width: 2.5, height: 8, borderRadius: 0.5, backgroundColor: severityMode ? SEV_COLORS.Warning : T.fgMuted, transition: "background-color 150ms" }} />
                <span style={{ width: 2.5, height: 10, borderRadius: 0.5, backgroundColor: severityMode ? SEV_COLORS.Error : T.fgMuted, transition: "background-color 150ms" }} />

        onContextMenu={e => {
          e.preventDefault();
          const rect = e.currentTarget.getBoundingClientRect();
          const xPct = (e.clientX - rect.left) / rect.width;
          const bucketIdx = Math.min(chartBuckets.length - 1, Math.floor(xPct * chartBuckets.length));
          const bucket = chartBuckets[bucketIdx];
          const topSeries = chartSeries.reduce((best, s) => (!best || (bucket[s.key] ?? 0) > (bucket[best.key] ?? 0)) ? s : best, null);

                const isHovered = hoveredLabel === s.label;

                  <div key={s.key}
                    onMouseEnter={() => setHoveredLabel(s.label)}
                    onMouseLeave={() => setHoveredLabel(null)}
                    style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "5px 10px", gap: 6, borderBottom: `1px solid ${T.border}`, cursor: "pointer", backgroundColor: isHovered ? T.muted : "transparent", opacity: isDimmed ? 0.35 : 1, transition: "opacity 150ms, background-color 100ms" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 6, minWidth: 0, flex: 1 }}>
                      <span style={{ width: 10, height: 10, borderRadius: 2, backgroundColor: s.color, flexShrink: 0 }} />
                      <span style={{ fontFamily: T.font, fontSize: T.textLabel, color: T.fg, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{s.label}</span>
                    </div>
                    <span style={{ fontFamily: T.mono, fontSize: T.textLabel, color: T.fgMuted, flexShrink: 0 }}>{fmtNum(s.total)}</span>
                  </div>
                );
              })}
            </div>
          </div>
        )}
        {chartMenu && (
          <ChartContextMenu
            x={chartMenu.x} y={chartMenu.y}
            seriesName={chartMenu.series?.label ?? "Unknown"}
            seriesColor={chartMenu.series?.color ?? T.fgMuted}
            timeLabel={chartMenu.bucket?.label || `Bucket ${chartMenu.bucketIdx + 1}`}
            onClose={() => setChartMenu(null)}
            onAction={(actionId) => {
              if (actionId === "include") addFilter(chartMenu.series?.label, "include");
              else if (actionId === "exclude") addFilter(chartMenu.series?.label, "exclude");
              setChartMenu(null);
            }}
          />
        )}
      </div>
    </div>
  );
}

function REDMetricsView({ panelH }) {
  const { groupBys } = useQuery();
  const [durationAgg, setDurationAgg] = useState("Average");
  const [durationDropOpen, setDurationDropOpen] = useState(false);
  const DURATION_AGGS = ["Average", "P50", "P95", "P99", "Max"];

  const redCharts = useMemo(() => {
    const rand1 = makeRand(111);
    const rand2 = makeRand(222);
    const rand3 = makeRand(333);
    const multipliers = { Average: 1, P50: 0.85, P95: 2.4, P99: 4.1, Max: 6.5 };
    const m = multipliers[durationAgg] ?? 1;
    const buckets = Array.from({ length: 48 }, (_, i) => {
      const totalMins = i * 30;
      const hour = (16 + Math.floor(totalMins / 60)) % 24;
      const min = totalMins % 60;
      const label = min === 0 ? `${String(hour).padStart(2, "0")}:00` : "";
      const t = i / 47;
      return {
        index: i, label,
        rate: Math.round(800 + 400 * Math.sin(t * Math.PI * 2) + rand1() * 100),
        errors: Math.round(12 + 20 * Math.sin(t * Math.PI * 3 + 1) + rand2() * 8),
        duration: Math.round((45 + 30 * Math.sin(t * Math.PI * 1.5 + 2) + rand3() * 10) * m),
      };
    });
    return [
      { id: "rate", title: "Rate", dataKey: "rate", color: "#5095ed", legendLabel: "Request rate", buckets },
      { id: "errors", title: "Errors", dataKey: "errors", color: "#eb6166", legendLabel: "Errors", buckets },
      { id: "duration", title: "Duration", dataKey: "duration", color: "#d866e7", legendLabel: "Duration", buckets },
    ];
  }, [durationAgg]);

  const groupByLabel = groupBys.length > 0 ? `by ${groupBys.join(", ")}` : "";

  return (
    <div style={{ display: "flex", gap: 8, height: panelH }}>
      {redCharts.map(chart => (
        <div key={chart.id} style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column", backgroundColor: T.card, border: `1px solid ${T.border}`, borderRadius: T.radius }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 10px", height: 30, minHeight: 30, borderBottom: `1px solid ${T.border}` }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <span style={{ fontFamily: T.font, fontSize: 12, fontWeight: 700, color: T.fg }}>{chart.title}</span>
              {/* Duration aggregation chip */}
              {chart.id === "duration" && (
                <div style={{ position: "relative" }} onMouseLeave={() => setDurationDropOpen(false)}>
                  <div onClick={() => setDurationDropOpen(p => !p)}
                    style={{
                      display: "flex", alignItems: "center", gap: 3, height: 20, padding: "0 6px",
                      borderRadius: 4, cursor: "pointer", userSelect: "none",
                      backgroundColor: T.muted, transition: "background-color 80ms",
                    }}>
                    <span style={{ fontFamily: T.font, fontSize: 11, fontWeight: 600, color: T.fg }}>{durationAgg}</span>
                    <ChevronDown size={9} color={T.fgMuted} style={{ transform: durationDropOpen ? "rotate(180deg)" : "rotate(0deg)", transition: "transform 150ms" }} />
                  </div>
                  {durationDropOpen && (
                    <div style={{ position: "absolute", top: "100%", left: 0, zIndex: 50, paddingTop: 2 }}>
                      <div style={{ backgroundColor: T.card, border: `1px solid ${T.border}`, borderRadius: T.radius, boxShadow: "0 4px 16px rgba(0,0,0,0.4)", minWidth: 110, padding: "4px 0" }}>
                        {DURATION_AGGS.map(agg => {
                          const isActive = durationAgg === agg;
                          return (
                            <div key={agg} onClick={() => { setDurationAgg(agg); setDurationDropOpen(false); }}
                              style={{
                                padding: "5px 12px", cursor: "pointer", fontFamily: T.font, fontSize: 12,
                                fontWeight: isActive ? 600 : 400,
                                color: isActive ? T.primary : T.fg,
                                backgroundColor: isActive ? "rgba(42,169,104,0.10)" : "transparent",
                                transition: "background-color 80ms",
                              }}
                              onMouseEnter={e => { if (!isActive) e.currentTarget.style.backgroundColor = T.muted; }}
                              onMouseLeave={e => { if (!isActive) e.currentTarget.style.backgroundColor = isActive ? "rgba(42,169,104,0.10)" : "transparent"; }}>
                              {agg}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
            <span style={{ fontFamily: T.font, fontSize: 9, color: T.fgMuted }}>{groupByLabel}</span>
          </div>
          <div style={{ flex: 1, minHeight: 0 }}>
            <ResponsiveContainer width="100%" height="100%">
              <LineChart data={chart.buckets} margin={{ top: 6, right: 4, bottom: 18, left: 0 }}>
                <CartesianGrid vertical={false} stroke="#3a3a4a" strokeOpacity={0.5} />
                <XAxis dataKey="index" interval={0} tick={props => {
                  const b = chart.buckets[props.payload.value];
                  if (!b?.label) return null;
                  const hourLabels = chart.buckets.filter(bk => bk.label).map(bk => bk.index);
                  const labelIdx = hourLabels.indexOf(props.payload.value);
                  if (labelIdx % 2 !== 0) return null;
                  return <g transform={`translate(${props.x},${props.y})`}><text x={0} y={0} dy={10} textAnchor="middle" fill={T.fgMuted} fontSize={9} fontFamily={T.font}>{b.label}</text></g>;
                }} axisLine={false} tickLine={false} tickSize={0} />
                <YAxis tickFormatter={chart.id === "duration" ? v => `${v}ms` : fmtNum} tick={{ fontFamily: T.font, fontSize: 9, fill: T.fgMuted }} axisLine={false} tickLine={false} width={chart.id === "duration" ? 38 : 32} />
                <Tooltip contentStyle={{ backgroundColor: T.card, border: `1px solid ${T.border}`, borderRadius: 6, fontFamily: T.font, fontSize: 11, color: T.fg }} formatter={v => [chart.id === "duration" ? `${v}ms` : fmtNum(v), chart.title]} labelFormatter={i => chart.buckets[i]?.label || ""} />
                <Line type="monotone" dataKey={chart.dataKey} stroke={chart.color} strokeWidth={1.5} dot={false} isAnimationActive={false} />
              </LineChart>
            </ResponsiveContainer>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 4, padding: "2px 10px 6px", flexShrink: 0 }}>
            <span style={{ width: 10, height: 3, borderRadius: 1, backgroundColor: chart.color }} />
            <span style={{ fontFamily: T.font, fontSize: 10, color: T.fgMuted }}>{chart.legendLabel}</span>
          </div>
        </div>
      ))}
    </div>
  );
}

function HybridView({ panelH }) {
  const { groupBys } = useQuery();
  const groupByLabel = groupBys.length > 0 ? `by ${groupBys.join(", ")}` : "";

  const hybridData = useMemo(() => {
    const rand = makeRand(777);
    return Array.from({ length: 48 }, (_, i) => {
      const totalMins = i * 30;
      const hour = (16 + Math.floor(totalMins / 60)) % 24;
      const min = totalMins % 60;
      const label = min === 0 ? `${String(hour).padStart(2, "0")}:00` : "";
      const t = i / 47;
      const traffic = Math.round(3000 + 2000 * Math.sin(t * Math.PI * 2) + rand() * 800);
      return {
        index: i, label,
        spans: traffic,
        errorCount: Math.round(traffic * (0.03 + 0.02 * Math.sin(t * Math.PI * 3 + 1) + rand() * 0.01)),
        avgLatency: Math.round(350 + 150 * Math.sin(t * Math.PI * 1.2 + 0.5) + rand() * 50),
        p95Latency: Math.round(800 + 300 * Math.sin(t * Math.PI * 1.3 + 0.8) + rand() * 80),
        p99Latency: Math.round(5000 + 3000 * Math.sin(t * Math.PI * 1.1 + 1.2) + rand() * 500),
        p999Latency: Math.round(50000 + 40000 * Math.sin(t * Math.PI * 0.8 + 0.3) + rand() * 10000),
      };
    });
  }, []);

  const scatterDots = useMemo(() => {
    const rand = makeRand(999);
    const dots = [];
    for (let i = 0; i < 48; i++) {
      const count = 3 + Math.floor(rand() * 5);
      for (let j = 0; j < count; j++) {
        const logMin = Math.log10(10);
        const logMax = Math.log10(2000000);
        const logVal = logMin + rand() * (logMax - logMin);
        dots.push({ bucketIdx: i, duration: Math.round(Math.pow(10, logVal)) });
      }
    }
    return dots;
  }, []);

  const fmtDuration = (v) => {
    if (v >= 1000000) return `${(v / 1000000).toFixed(1)}s`;
    if (v >= 1000) return `${(v / 1000).toFixed(0)}ms`;
    return `${v}us`;
  };

  const LEGEND = [
    { label: "Spans", color: "#666", type: "bar" },
    { label: "Error Count", color: "#eb6166", type: "line" },
    { label: "Avg Latency", color: "#60a5fa", type: "line" },
    { label: "P95 Latency", color: "#f97316", type: "line" },
    { label: "P99 Latency", color: "#f472b6", type: "line" },
    { label: "P99.9 Latency", color: "#22d3ee", type: "line" },
    { label: "Span durations", color: "#c084fc", type: "dot" },
  ];

  const ScatterOverlay = ({ chartArea }) => {
    if (!chartArea || !chartArea.width) return null;
    const { left, top, width, height } = chartArea;
    const logMin = Math.log10(10);
    const logMax = Math.log10(2000000);
    const bucketW = width / 48;

    const durationToY = (val) => {
      const logVal = Math.log10(Math.max(10, val));
      const yPct = 1 - (logVal - logMin) / (logMax - logMin);
      return top + yPct * height;
    };

    const lines = [
      { key: "avgLatency", color: "#60a5fa", width: 2 },
      { key: "p95Latency", color: "#f97316", width: 2 },
      { key: "p99Latency", color: "#f472b6", width: 2 },
      { key: "p999Latency", color: "#22d3ee", width: 2.5 },
    ];

    return (
      <svg style={{ position: "absolute", left: 0, top: 0, width: "100%", height: "100%", pointerEvents: "none" }}>
        {/* Left Y-axis: Duration log scale labels */}
        {[10, 100, 1000, 10000, 100000, 1000000].map(val => {
          const y = durationToY(val);
          if (y < top - 2 || y > top + height + 2) return null;
          return (
            <g key={val}>
              <line x1={left} y1={y} x2={left + width} y2={y} stroke="#3a3a4a" strokeOpacity={0.3} strokeDasharray="2,3" />
              <text x={left - 4} y={y + 3} textAnchor="end" fill={T.fgMuted} fontSize={9} fontFamily={T.font}>{fmtDuration(val)}</text>
            </g>
          );
        })}
        <text x={6} y={top + height / 2} textAnchor="middle" fill={T.fgMuted} fontSize={9} fontFamily={T.font} transform={`rotate(-90, 6, ${top + height / 2})`}>Duration</text>
        {/* Latency percentile lines */}
        {lines.map(line => {
          const points = hybridData.map((b, i) => {
            const x = left + i * bucketW + bucketW * 0.5;
            const y = durationToY(b[line.key]);
            return `${x},${y}`;
          }).join(" ");
          return <polyline key={line.key} points={points} fill="none" stroke={line.color} strokeWidth={line.width} strokeLinejoin="round" strokeLinecap="round" />;
        })}
        {/* Error count line (right Y axis - linear scale) */}
        {(() => {
          const maxErrors = Math.max(...hybridData.map(b => b.errorCount), 1);
          const points = hybridData.map((b, i) => {
            const x = left + i * bucketW + bucketW * 0.5;
            const yPct = 1 - b.errorCount / (maxErrors * 1.2);
            const y = top + yPct * height;
            return `${x},${y}`;
          }).join(" ");
          return <polyline points={points} fill="none" stroke="#eb6166" strokeWidth={2} strokeLinejoin="round" strokeLinecap="round" />;
        })()}
        {/* Scatter dots */}
        {scatterDots.map((dot, i) => {
          const x = left + dot.bucketIdx * bucketW + bucketW * 0.5 + (Math.sin(i * 137.5) * bucketW * 0.3);
          const y = durationToY(dot.duration);
          if (y < top || y > top + height) return null;
          return <circle key={i} cx={x} cy={y} r={2.5} fill="#c084fc" opacity={0.7} />;
        })}
      </svg>
    );
  };

  const [chartArea, setChartArea] = useState(null);
  const chartContainerRef = useRef(null);

  return (
    <div style={{ display: "flex", gap: 0, height: panelH }}>
      <div style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column", backgroundColor: T.card, border: `1px solid ${T.border}`, borderRadius: T.radius }}>
        {/* Header */}
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 10px", height: 30, minHeight: 30, borderBottom: `1px solid ${T.border}` }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <span style={{ fontFamily: T.font, fontSize: 12, fontWeight: 700, color: T.fg }}>Hybrid view</span>
            <span style={{ fontFamily: T.font, fontSize: 10, color: T.fgMuted }}>Duration (ms) + Error Count</span>
          </div>
          <span style={{ fontFamily: T.font, fontSize: 9, color: T.fgMuted }}>{groupByLabel}</span>
        </div>
        {/* Chart */}
        <div ref={chartContainerRef} style={{ flex: 1, minHeight: 0, position: "relative" }}>
          <ResponsiveContainer width="100%" height="100%"
            onResize={(w, h) => {
              if (w && h) setChartArea({ left: 48, top: 6, width: w - 48 - 40, height: h - 6 - 24 });
            }}>
            <BarChart data={hybridData} margin={{ top: 6, right: 40, bottom: 24, left: 48 }} barCategoryGap="1%">
              <CartesianGrid vertical={false} stroke="#3a3a4a" strokeOpacity={0.4} />
              <XAxis dataKey="index" interval={0} tick={props => {
                const b = hybridData[props.payload.value];
                if (!b?.label) return null;
                const hourLabels = hybridData.filter(bk => bk.label).map(bk => bk.index);
                const labelIdx = hourLabels.indexOf(props.payload.value);
                if (labelIdx % 2 !== 0) return null;
                return <g transform={`translate(${props.x},${props.y})`}><text x={0} y={0} dy={10} textAnchor="middle" fill={T.fgMuted} fontSize={9} fontFamily={T.font}>{b.label}</text></g>;
              }} axisLine={false} tickLine={false} tickSize={0} />
              {/* Left Y: Duration (log scale labels - decorative, lines are SVG) */}
              <YAxis yAxisId="left" hide />
              {/* Right Y: Error/Span count */}
              <YAxis yAxisId="right" orientation="right"
                tickFormatter={fmtNum}
                tick={{ fontFamily: T.font, fontSize: 9, fill: T.fgMuted }} axisLine={false} tickLine={false} width={40}
              />
              <Tooltip
                contentStyle={{ backgroundColor: T.card, border: `1px solid ${T.border}`, borderRadius: 6, fontFamily: T.font, fontSize: 11, color: T.fg }}
                formatter={(v, name) => {
                  if (name === "spans") return [fmtNum(v), "Spans"];
                  return [v, name];
                }}
                labelFormatter={i => hybridData[i]?.label || ""}
              />
              {/* Span volume bars */}
              <Bar yAxisId="right" dataKey="spans" fill="#555" fillOpacity={0.5} isAnimationActive={false} />
            </BarChart>
          </ResponsiveContainer>
          {/* Scatter overlay */}
          <ScatterOverlay chartArea={chartArea} />
        </div>
        {/* Legend */}
        <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "3px 10px 6px", flexShrink: 0, flexWrap: "wrap" }}>
          {LEGEND.map(l => (
            <div key={l.label} style={{ display: "flex", alignItems: "center", gap: 4 }}>
              {l.type === "bar" && <span style={{ width: 10, height: 10, borderRadius: 2, backgroundColor: l.color, opacity: 0.5 }} />}
              {l.type === "line" && <span style={{ width: 12, height: 2, borderRadius: 1, backgroundColor: l.color }} />}
              {l.type === "dot" && <span style={{ width: 8, height: 8, borderRadius: "50%", backgroundColor: l.color, opacity: 0.7 }} />}
              <span style={{ fontFamily: T.font, fontSize: 10, color: T.fgMuted }}>{l.label}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function LogsSeverityChart({ panelH, groupBys }) {
  const SEV_COLORS = { Debug: "#9ca3af", Info: "#60a5fa", Warning: "#fbbf24", Error: "#f87171" };
  const SEVS = ["Debug", "Info", "Warning", "Error"];

  const data = useMemo(() => {
    const rand = makeRand(888);
    return Array.from({ length: 48 }, (_, i) => {
      const totalMins = i * 30;
      const hour = (16 + Math.floor(totalMins / 60)) % 24;
      const min = totalMins % 60;
      const label = min === 0 ? `${String(hour).padStart(2, "0")}:00` : "";
      const t = i / 47;
      const base = 2000 + 800 * Math.sin(t * Math.PI * 2);
      return {
        index: i, label,
        Debug: Math.round(base * 0.45 + rand() * 200),
        Info: Math.round(base * 0.35 + rand() * 150),
        Warning: Math.round(base * 0.12 + rand() * 60),
        Error: Math.round(base * 0.08 + rand() * 40),
      };
    });
  }, []);

  const chartLabel = groupBys.length > 0 ? `Count by ${groupBys.join(", ")} (severity)` : "Log count by severity";

  return (
    <div style={{ display: "flex", gap: 0, height: panelH }}>
      <div style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column", backgroundColor: T.card, border: `1px solid ${T.border}`, borderRadius: T.radius }}>
        <div style={{ display: "flex", alignItems: "center", padding: "0 10px", height: 30, minHeight: 30, borderBottom: `1px solid ${T.border}` }}>
          <span style={{ fontFamily: T.font, fontSize: 12, fontWeight: 700, color: T.fg }}>{chartLabel}</span>
        </div>
        <div style={{ flex: 1, minHeight: 0 }}>
          <ResponsiveContainer width="100%" height="100%">
            <BarChart data={data} margin={{ top: 6, right: 4, bottom: 18, left: 0 }} barCategoryGap="1%">
              <CartesianGrid vertical={false} stroke="#3a3a4a" strokeOpacity={0.5} />
              <XAxis dataKey="index" interval={0} tick={props => {
                const b = data[props.payload.value];
                if (!b?.label) return null;
                const hourLabels = data.filter(bk => bk.label).map(bk => bk.index);
                const labelIdx = hourLabels.indexOf(props.payload.value);
                if (labelIdx % 2 !== 0) return null;
                return <g transform={`translate(${props.x},${props.y})`}><text x={0} y={0} dy={10} textAnchor="middle" fill={T.fgMuted} fontSize={9} fontFamily={T.font}>{b.label}</text></g>;
              }} axisLine={false} tickLine={false} tickSize={0} />
              <YAxis tickFormatter={fmtNum} tick={{ fontFamily: T.font, fontSize: 9, fill: T.fgMuted }} axisLine={false} tickLine={false} width={36} />
              <Tooltip
                contentStyle={{ backgroundColor: T.card, border: `1px solid ${T.border}`, borderRadius: 6, fontFamily: T.font, fontSize: 11, color: T.fg }}
                formatter={(v, name) => [fmtNum(v), name]}
                labelFormatter={i => data[i]?.label || ""}
              />
              {SEVS.map(s => <Bar key={s} dataKey={s} stackId="sev" fill={SEV_COLORS[s]} isAnimationActive={false} />)}
            </BarChart>
          </ResponsiveContainer>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "2px 10px 6px", flexShrink: 0 }}>
          {SEVS.map(s => (
            <div key={s} style={{ display: "flex", alignItems: "center", gap: 4 }}>
              <span style={{ width: 10, height: 10, borderRadius: 2, backgroundColor: SEV_COLORS[s] }} />
              <span style={{ fontFamily: T.font, fontSize: 10, color: T.fgMuted }}>{s}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function WorkspaceContent() {
  const userResizedRef = useRef(false);
  const scrolledRef = useRef(false);

  useMemo(() => {
    window._onGraphScroll = (scrollTop) => {
      if (userResizedRef.current) return;
      const isScrolled = scrollTop > 20;
      if (isScrolled !== scrolledRef.current) {
        scrolledRef.current = isScrolled;
        if (window._setGraphPanelH) window._setGraphPanelH(isScrolled ? 130 : 240);
      }
    };
    return () => { window._onGraphScroll = null; };
  }, []);

  const onUserResize = useCallback(() => {
    userResizedRef.current = true;
  }, []);

  return (
    <div style={{ flex: 1, overflow: "hidden", padding: 16, display: "flex", flexDirection: "column", gap: 12, minHeight: 0 }}>
      <div style={{ flexShrink: 0 }}><QueryBuilder /></div>
      <div style={{ flexShrink: 0 }}>
        <GraphSection onUserResize={onUserResize} />
      </div>
      <DrilldownTabs />
    </div>
  );
}

function GraphSection({ onUserResize }) {
  const { groupBys, aggregations, dataType } = useQuery();
  const hasQuery = groupBys.length > 0 || aggregations.length > 0;
  const hasCustomAgg = aggregations.some(a => a !== "Count");
  const isLogs = dataType === "Logs";

  const modes = isLogs ? [] : (hasQuery ? ["RED metrics", "Hybrid view", "Query result"] : ["RED metrics", "Hybrid view"]);
  const [graphMode, setGraphMode] = useState(isLogs ? "Query result" : "RED metrics");
  const [collapsed, setCollapsed] = useState(false);

  useMemo(() => {
    if (!isLogs) {
      if (hasQuery && graphMode === "RED metrics" && hasCustomAgg && modes.includes("Query result")) {
        setGraphMode("Query result");
      }
      if (!hasQuery && graphMode === "Query result") setGraphMode("RED metrics");
    }
  }, [hasQuery, hasCustomAgg]);

  useMemo(() => {
    if (isLogs) setGraphMode("Query result");
    if (!isLogs && graphMode === "Query result" && !hasQuery) setGraphMode("RED metrics");
  }, [dataType]);

  const [panelH, setPanelH] = useState(240);
  const [dragging, setDragging] = useState(false);
  const dragRef = useRef(null);

  // Register global setter for scroll-triggered resize
  useMemo(() => {
    window._setGraphPanelH = (h) => setPanelH(h);
    return () => { window._setGraphPanelH = null; };
  }, []);

  const onHandleDown = useCallback(e => {
    if (collapsed) return;
    e.preventDefault();
    if (onUserResize) onUserResize();
    dragRef.current = { startY: e.clientY, startH: panelH };
    setDragging(true);
    const onMove = ev => {
      if (!dragRef.current) return;
      const h = Math.max(80, Math.round(dragRef.current.startH + ev.clientY - dragRef.current.startY));
      setPanelH(h);
    };
    const onUp = () => { dragRef.current = null; setDragging(false); document.removeEventListener("mousemove", onMove); document.removeEventListener("mouseup", onUp); };
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  }, [panelH, collapsed, onUserResize]);

  const segStyle = (active) => ({
    display: "flex", alignItems: "center", justifyContent: "center",
    height: 20, padding: "0 8px", borderRadius: 4, cursor: "pointer",
    fontFamily: T.font, fontSize: 12, fontWeight: 700, userSelect: "none",
    color: active ? T.primary : T.fgMuted,
    backgroundColor: active ? T.card : "transparent",
    border: active ? `1px solid ${T.border}` : "1px solid transparent",
    boxShadow: active ? "0 0 4px rgba(0,0,0,0.12)" : "none",
    transition: "all 120ms",
  });

  const headerLabel = isLogs ? "Query result" : graphMode;

  return (
    <div style={{ display: "flex", flexDirection: "column", flexShrink: 0 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 0 6px", flexShrink: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6, cursor: "pointer", userSelect: "none" }}
          onClick={() => setCollapsed(c => !c)}>
          <ChevronDown size={12} color={T.fgMuted} style={{ transform: collapsed ? "rotate(-90deg)" : "rotate(0deg)", transition: "transform 200ms" }} />
          <span style={{ fontFamily: T.font, fontSize: 14, fontWeight: 500, color: T.fg }}>
            {headerLabel}
          </span>
        </div>
        {/* Spans segmented toggle only */}
        {!isLogs && modes.length > 0 && (
          <div style={{ display: "flex", backgroundColor: T.muted, borderRadius: 6, padding: 2, gap: 2 }}>
            {modes.map(mode => (
              <div key={mode} onClick={() => { setGraphMode(mode); if (collapsed) setCollapsed(false); }} style={segStyle(graphMode === mode)}>
                {mode}
              </div>
            ))}
          </div>
        )}
      </div>

      {!collapsed && (
        <>
          {!isLogs && graphMode === "RED metrics" && <REDMetricsView panelH={panelH} />}
          {!isLogs && graphMode === "Hybrid view" && <HybridView panelH={panelH} />}
          {(isLogs || graphMode === "Query result") && <QueryResultsSectionInner panelH={panelH} />}
        </>
      )}

      {!collapsed && (
        <div onMouseDown={onHandleDown} style={{ height: 8, cursor: "ns-resize", display: "flex", alignItems: "center", justifyContent: "center", userSelect: "none" }}>
          <div style={{ width: 36, height: 3, borderRadius: 2, backgroundColor: dragging ? T.fgMuted : T.border, transition: "background-color 150ms" }} />
        </div>
      )}
    </div>
  );
}
function QueryResultsSectionInner({ panelH }) {
  const { chartsData, aggregations, groupBys } = useQuery();
  const [carouselOffset, setCarouselOffset] = useState(0);
  const [containerW, setContainerW] = useState(0);
  const containerRef = useRef(null);

  const setRef = useCallback(el => {
    containerRef.current = el;
    if (el) setContainerW(el.offsetWidth);
  }, []);

  useMemo(() => {
    if (typeof window === "undefined") return;
    const measure = () => { if (containerRef.current) setContainerW(containerRef.current.offsetWidth); };
    window.addEventListener("resize", measure);
    return () => window.removeEventListener("resize", measure);
  }, []);

  const aggLabels = { Count: "Count", "Count Distinct": "Count Distinct", Sum: "Sum (bytes)", Min: "Min", Max: "Max" };
  const buildLabel = (agg) => {
    const aggName = aggLabels[agg] ?? agg;
    if (groupBys.length === 0) return aggName;
    return `${aggName} by ${groupBys.join(", ")}`;
  };
  const count = chartsData.length;
  const needsCarousel = count > 3;
  const maxOffset = Math.max(0, count - 3);

  useMemo(() => { if (carouselOffset > maxOffset) setCarouselOffset(maxOffset); }, [count]);

  const navBtn = { width: 28, height: 28, display: "flex", alignItems: "center", justifyContent: "center", borderRadius: "50%", border: `1px solid ${T.border}`, backgroundColor: T.card, cursor: "pointer", color: T.fg, flexShrink: 0, transition: "background-color 80ms" };

  const gap = 8;
  const visibleSlots = needsCarousel ? 3 : count;
  const chartW = containerW > 0 ? Math.floor((containerW - gap * (visibleSlots - 1)) / visibleSlots) : 400;
  const trackW = count * chartW + (count - 1) * gap;
  const translateX = -(carouselOffset * (chartW + gap));

  return (
    <div style={{ display: "flex", flexDirection: "column", flexShrink: 0 }}>
      <div style={{ display: "flex", gap: 0, height: panelH, position: "relative", alignItems: "stretch" }}>
        {/* Carousel left arrow */}
        {needsCarousel && (
          <div style={{ display: "flex", alignItems: "center", flexShrink: 0, paddingRight: 6 }}>
            <div
              onClick={() => setCarouselOffset(o => Math.max(0, o - 1))}
              style={{ ...navBtn, opacity: carouselOffset === 0 ? 0.3 : 1, pointerEvents: carouselOffset === 0 ? "none" : "auto" }}
              onMouseEnter={e => e.currentTarget.style.backgroundColor = T.muted}
              onMouseLeave={e => e.currentTarget.style.backgroundColor = T.card}
            >
              <ChevronDown size={14} style={{ transform: "rotate(90deg)" }} />
            </div>
          </div>
        )}

        {needsCarousel ? (
          /* Sliding carousel track */
          <div ref={setRef} style={{ flex: 1, overflow: "hidden", minWidth: 0 }}>
            <div
              style={{
                display: "flex",
                gap: gap,
                width: trackW > 0 ? trackW : "100%",
                transform: `translateX(${translateX}px)`,
                transition: "transform 400ms cubic-bezier(0.25, 0.1, 0.25, 1)",
                height: "100%",
              }}
            >
              {chartsData.map(cd => (
                <div key={cd.aggregation} style={{ width: chartW > 0 ? chartW : "50%", flexShrink: 0, height: "100%" }}>
                  <SingleChart
                    chartSeries={cd.series}
                    chartBuckets={cd.buckets}
                    aggregationLabel={buildLabel(cd.aggregation)}
                    compact={true}
                    panelH={panelH}
                  />
                </div>
              ))}
            </div>
          </div>
        ) : (
          /* Non-carousel: 1 to 3 charts side by side */
          <div style={{ flex: 1, display: "flex", gap: 8, minWidth: 0, height: "100%" }}>
            {chartsData.map(cd => (
              <div key={cd.aggregation} style={{ flex: 1, minWidth: 0, height: "100%" }}>
                <SingleChart
                  chartSeries={cd.series}
                  chartBuckets={cd.buckets}
                  aggregationLabel={buildLabel(cd.aggregation)}
                  compact={count > 1}
                  panelH={panelH}
                />
              </div>
            ))}
          </div>
        )}

        {/* Carousel right arrow */}
        {needsCarousel && (
          <div style={{ display: "flex", alignItems: "center", flexShrink: 0, paddingLeft: 6 }}>
            <div
              onClick={() => setCarouselOffset(o => Math.min(maxOffset, o + 1))}
              style={{ ...navBtn, opacity: carouselOffset >= maxOffset ? 0.3 : 1, pointerEvents: carouselOffset >= maxOffset ? "none" : "auto" }}
              onMouseEnter={e => e.currentTarget.style.backgroundColor = T.muted}
              onMouseLeave={e => e.currentTarget.style.backgroundColor = T.card}
            >
              <ChevronDown size={14} style={{ transform: "rotate(-90deg)" }} />
            </div>
          </div>
        )}
      </div>

      {/* Carousel dots */}
      {needsCarousel && (
        <div style={{ display: "flex", justifyContent: "center", gap: 6, padding: "6px 0 2px" }}>
          {Array.from({ length: maxOffset + 1 }, (_, i) => (
            <div
              key={i}
              onClick={() => setCarouselOffset(i)}
              style={{
                width: carouselOffset === i ? 16 : 6,
                height: 6,
                borderRadius: 3,
                backgroundColor: carouselOffset === i ? T.primary : T.border,
                cursor: "pointer",
                transition: "all 300ms cubic-bezier(0.25, 0.1, 0.25, 1)",
              }}
            />
          ))}
        </div>
      )}
    </div>
  );
}

const CELL_MENU_ITEMS = [

  return (
    <>
      <div onClick={onClose} style={{ position: "fixed", inset: 0, zIndex: 998 }} />
      <div
        onMouseLeave={onClose}
        style={{

        }}
      >
        {CELL_MENU_ITEMS.map((item, i) => (
          <div key={item.id}>
            {i === 2 || i === 4 ? <div style={{ height: 1, backgroundColor: T.border, margin: "3px 0" }} /> : null}
            <div
              onClick={() => { if (onAction) onAction(item.id, cellValue); onClose(); }}

                display: "flex", alignItems: "center", gap: 8, padding: "7px 12px",

                color: T.fg, fontWeight: 400,

      </div>

}

function useCellMenu() {
  const { addFilter } = useQuery();
  const [menu, setMenu] = useState(null);
  const onCellContext = useCallback((e, value) => {
    e.preventDefault();
    setMenu({ x: e.clientX, y: e.clientY, value });
  }, []);
  const closeMenu = useCallback(() => setMenu(null), []);
  const onAction = useCallback((actionId, value) => {
    if (actionId === "include") addFilter(value, "include");
    else if (actionId === "exclude") addFilter(value, "exclude");
  }, [addFilter]);
  return { menu, onCellContext, closeMenu, onAction };
}

function OverviewTable({ rows, groupBys, aggregations }) {
  const { hoveredLabel, setHoveredLabel } = useQuery();
  const { menu, onCellContext, closeMenu, onAction } = useCellMenu();
  const [sortDir, setSortDir] = useState("desc");
  const [sortAgg, setSortAgg] = useState(aggregations[0]);
  const sorted = useMemo(() => {
    if (!sortDir) return rows;
    return [...rows].sort((a, b) => {
      const aVal = (aggregations.length > 1 && a.aggValues) ? (a.aggValues[sortAgg] ?? a.value) : a.value;
      const bVal = (aggregations.length > 1 && b.aggValues) ? (b.aggValues[sortAgg] ?? b.value) : b.value;
      return sortDir === "desc" ? bVal - aVal : aVal - bVal;
    });
  }, [rows, sortDir, sortAgg, aggregations]);
  const toggleSort = (agg) => {
    if (sortAgg === agg) setSortDir(prev => prev === "desc" ? "asc" : "desc");
    else { setSortAgg(agg); setSortDir("desc"); }
  };
  const SortIcon = sortDir === "asc" ? ChevronUp : ChevronDown;
  const aggLabels = { Count: "count", "Count Distinct": "count distinct", Sum: "sum (bytes)", Min: "min", Max: "max" };

  const thBase = { padding: "8px 12px", textAlign: "left", color: T.fgMuted, fontWeight: 600, fontSize: T.textLabel, userSelect: "none", position: "sticky", top: 0, backgroundColor: T.muted, zIndex: 1 };

  return (
    <div style={{ width: "100%", display: "flex", flexDirection: "column", flex: 1, minHeight: 0, overflow: "hidden" }}>
      <div style={{ flex: 1, minHeight: 0, overflowY: "auto", overflowX: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", fontFamily: T.font, fontSize: T.textP }}>
          <thead>
            <tr style={{ borderBottom: `1px solid ${T.border}`, backgroundColor: T.muted }}>
              <th style={{ ...thBase, width: 40 }}>#</th>
              {groupBys.map(gb => (
                <th key={gb} style={{ ...thBase, minWidth: 100 }}>{gb}</th>
              ))}
              {aggregations.map(agg => (
                <th key={agg} onClick={() => toggleSort(agg)} style={{ ...thBase, width: 140, cursor: "pointer" }}>
                  <span style={{ display: "inline-flex", alignItems: "center", gap: 4 }}>
                    {aggLabels[agg] ?? agg}
                    {sortAgg === agg && sortDir && <SortIcon size={12} />}
                  </span>
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {sorted.map((row, i) => {
              const isHovered = hoveredLabel === row.label;
              const isDimmed = hoveredLabel && !isHovered;
              return (
              <tr key={row.rank}
                onMouseEnter={() => setHoveredLabel(row.label)}
                onMouseLeave={() => setHoveredLabel(null)}
                style={{ borderBottom: `1px solid ${T.border}`, transition: "background-color 100ms, opacity 150ms", backgroundColor: isHovered ? T.muted : "transparent", opacity: isDimmed ? 0.35 : 1, cursor: "pointer" }}>
                <td style={{ padding: "7px 12px", color: T.fgMuted, fontSize: T.textLabel, fontFamily: T.mono }}>{i + 1}</td>
                {groupBys.map((gb, gi) => {
                  const cellVal = row.fields?.[gb] ?? row.label;
                  return (
                  <td key={gb} style={{ padding: "7px 12px" }} onContextMenu={e => onCellContext(e, cellVal)}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      {gi === 0 && <span style={{ width: 10, height: 10, borderRadius: 2, backgroundColor: row.color, flexShrink: 0 }} />}
                      {gb === "level" && row.fields?.[gb] ? (
                        <span style={{ display: "inline-flex", alignItems: "center", backgroundColor: (LEVEL_COLORS[row.fields[gb]] ?? { bg: T.muted }).bg, color: (LEVEL_COLORS[row.fields[gb]] ?? { fg: T.fg }).fg, borderRadius: 3, padding: "1px 6px", fontFamily: T.mono, fontSize: T.textLabel, fontWeight: 600 }}>
                          {row.fields[gb]}
                        </span>
                      ) : (
                        <span style={{ color: T.fg, fontSize: T.textP, fontFamily: T.font, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", maxWidth: 300 }}>
                          {cellVal}
                        </span>
                      )}
                    </div>
                  </td>
                  );
                })}
                {aggregations.map(agg => {
                  const val = (aggregations.length > 1 && row.aggValues) ? (row.aggValues[agg] ?? row.value) : row.value;
                  return (
                    <td key={agg} style={{ padding: "7px 12px", textAlign: "left", fontFamily: T.mono, fontSize: T.textP, color: T.fg, whiteSpace: "nowrap" }} onContextMenu={e => onCellContext(e, fmtValue(val))}>{fmtValue(val)}</td>
                  );
                })}
              </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <div style={{ padding: "6px 12px", borderTop: `1px solid ${T.border}`, fontFamily: T.font, fontSize: T.textLabel, color: T.fgMuted, flexShrink: 0 }}>
        {sorted.length} results
      </div>
      {menu && <CellContextMenu x={menu.x} y={menu.y} cellValue={menu.value} onClose={closeMenu} onAction={onAction} />}
    </div>
  );
}

  const nodeW = 180;
  const nodeH = 52;
  const canvasW = 760;
  const canvasH = 480;

  return (

              <div style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0 }}>
                <span style={{ fontSize: 9, color: T.fgMuted }}>:</span>
                <span style={{ width: 24, height: 24, borderRadius: 4, backgroundColor: svc.color, display: "inline-flex", alignItems: "center", justifyContent: "center", fontSize: 11, color: "#fff", flexShrink: 0 }}>
                  {svc.icon.slice(0, 2)}
                </span>

        </div>

        {/* SVG canvas for edges */}
        <svg style={{ position: "absolute", top: 36, left: 0, width: canvasW, height: canvasH, pointerEvents: "none" }}>
          <defs>
            <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
              <polygon points="0 0, 8 3, 0 6" fill="#f59e0b" />
            </marker>
          </defs>
          {DEP_MAP_EDGES.map((edge, i) => {
            const fromPos = DEP_MAP_POSITIONS[edge.from];
            const toPos = DEP_MAP_POSITIONS[edge.to];
            if (!fromPos || !toPos) return null;
            const x1 = (fromPos.x / 100) * canvasW + nodeW / 2;
            const y1 = (fromPos.y / 100) * canvasH + nodeH / 2;
            const x2 = (toPos.x / 100) * canvasW + nodeW / 2;
            const y2 = (toPos.y / 100) * canvasH + nodeH / 2;
            const dx = x2 - x1;
            const dy = y2 - y1;
            const len = Math.sqrt(dx * dx + dy * dy);
            const offsetStart = 40;
            const offsetEnd = 50;
            const sx = x1 + (dx / len) * offsetStart;
            const sy = y1 + (dy / len) * offsetStart;
            const ex = x2 - (dx / len) * offsetEnd;
            const ey = y2 - (dy / len) * offsetEnd;
            const mx = (sx + ex) / 2;
            const my = (sy + ey) / 2;
            const isHighlighted = hoveredNode === edge.from || hoveredNode === edge.to;
            return (
              <g key={i}>
                <line x1={sx} y1={sy} x2={ex} y2={ey}
                  stroke={isHighlighted ? "#f59e0b" : "#4a4a4e"}
                  strokeWidth={isHighlighted ? 2 : 1}
                  markerEnd="url(#arrowhead)"
                  opacity={isHighlighted ? 1 : 0.6}
                />
                <rect x={mx - 28} y={my - 8} width={56} height={16} rx={3}
                  fill={T.card} stroke={T.border} strokeWidth={0.5}
                />
                <text x={mx} y={my + 3} textAnchor="middle"
                  fill={T.fgMuted} fontSize={8} fontFamily={T.font}
                >
                  {edge.latency}
                </text>
              </g>
            );
          })}
        </svg>

        {/* Nodes */}
        {DEP_MAP_SERVICES.map(svc => {
          const pos = DEP_MAP_POSITIONS[svc.id];
          if (!pos) return null;
          const isHovered = hoveredNode === svc.id;
          const isConnected = hoveredNode && DEP_MAP_EDGES.some(e =>
            (e.from === hoveredNode && e.to === svc.id) || (e.to === hoveredNode && e.from === svc.id)
          );
          const dimmed = hoveredNode && !isHovered && !isConnected && hoveredNode !== svc.id;
          return (
            <div
              key={svc.id}
              style={{
                position: "absolute",
                left: (pos.x / 100) * canvasW,
                top: 36 + (pos.y / 100) * canvasH,
                width: nodeW,
                height: nodeH,
                backgroundColor: T.card,
                border: `1px solid ${isHovered ? "#f59e0b" : T.border}`,
                borderRadius: T.radius,
                padding: "6px 10px",
                display: "flex",
                alignItems: "center",
                gap: 8,
                cursor: "pointer",
                opacity: dimmed ? 0.35 : 1,
                transition: "opacity 150ms, border-color 150ms",
                zIndex: isHovered ? 10 : 1,
              }}
              onMouseEnter={() => setHoveredNode(svc.id)}
              onMouseLeave={() => setHoveredNode(null)}
            >
              <span style={{ width: 24, height: 24, borderRadius: 4, backgroundColor: svc.color, display: "inline-flex", alignItems: "center", justifyContent: "center", fontSize: 11, color: "#fff", flexShrink: 0 }}>
                {svc.icon.slice(0, 2)}
              </span>
              <div style={{ display: "flex", flexDirection: "column", minWidth: 0 }}>
                <span style={{ fontFamily: T.font, fontSize: T.textLabel, fontWeight: 600, color: T.fg, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                  {svc.name}
                </span>
                <div style={{ display: "flex", alignItems: "center", gap: 4, fontFamily: T.font, fontSize: 9, color: T.fgMuted }}>
                  <span>{svc.type}</span>
                  {svc.requests > 0 && (
                    <>
                      <span>.</span>
                      <span>{svc.requests} Requests</span>
                      {svc.warning && <span style={{ color: "#f59e0b" }}>! {svc.warning}</span>}
                    </>
                  )}
                  {svc.errors > 0 && <span style={{ color: "#ef4444" }}>x {svc.errors}</span>}
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function OverviewDonut({ rows, aggregations }) {
  const { hoveredLabel, setHoveredLabel } = useQuery();
  const aggLabels = { Count: "count", "Count Distinct": "count distinct", Sum: "sum (bytes)", Min: "min", Max: "max" };
  const agg = aggregations[0];
  const data = useMemo(() => [...rows].sort((a, b) => b.value - a.value).slice(0, 8).map(r => ({ name: r.label, value: r.value, color: r.color })), [rows]);
  const total = data.reduce((s, d) => s + d.value, 0);

  const size = 260;
  const cx = size / 2, cy = size / 2;
  const outerR = 115, innerR = 68, hoverGrow = 6;

  const arcs = useMemo(() => {
    const result = [];
    let angle = -Math.PI / 2;
    data.forEach(d => {
      const sweep = total > 0 ? (d.value / total) * Math.PI * 2 : 0;
      const startAngle = angle;
      const endAngle = angle + sweep;
      const midAngle = startAngle + sweep / 2;
      result.push({ ...d, startAngle, endAngle, midAngle, sweep });
      angle = endAngle;
    });
    return result;
  }, [data, total]);

  const describeArc = (cxv, cyv, r1, r2, start, end) => {
    const gap = 0.01;
    const s = start + gap;
    const e = end - gap;
    if (e <= s) return "";
    const large = (e - s) > Math.PI ? 1 : 0;
    const x1o = cxv + r2 * Math.cos(s), y1o = cyv + r2 * Math.sin(s);
    const x2o = cxv + r2 * Math.cos(e), y2o = cyv + r2 * Math.sin(e);
    const x1i = cxv + r1 * Math.cos(e), y1i = cyv + r1 * Math.sin(e);
    const x2i = cxv + r1 * Math.cos(s), y2i = cyv + r1 * Math.sin(s);
    return `M ${x1o} ${y1o} A ${r2} ${r2} 0 ${large} 1 ${x2o} ${y2o} L ${x1i} ${y1i} A ${r1} ${r1} 0 ${large} 0 ${x2i} ${y2i} Z`;
  };

  return (
    <div style={{ display: "flex", flex: 1, minHeight: 0, overflow: "hidden" }}>
      {/* Donut chart */}
      <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", minWidth: 0, padding: 16 }}>
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ overflow: "visible" }}>
          {arcs.map((arc, i) => {
            const isHovered = hoveredLabel === arc.name;
            const isDimmed = hoveredLabel && !isHovered;
            const r2 = isHovered ? outerR + hoverGrow : outerR;
            const r1 = isHovered ? innerR - 2 : innerR;
            const pct = total > 0 ? ((arc.value / total) * 100).toFixed(1) : "0";
            const labelR = (outerR + innerR) / 2;
            const lx = cx + labelR * Math.cos(arc.midAngle);
            const ly = cy + labelR * Math.sin(arc.midAngle);
            const showSliceLabel = arc.sweep > 0.3;
            const showExtLabel = !showSliceLabel && arc.sweep > 0.12;
            const extR = outerR + 22;
            const elx = cx + extR * Math.cos(arc.midAngle);
            const ely = cy + extR * Math.sin(arc.midAngle);

            return (
              <g key={i}
                onMouseEnter={() => setHoveredLabel(arc.name)}
                onMouseLeave={() => setHoveredLabel(null)}
                style={{ cursor: "pointer" }}>
                <path
                  d={describeArc(cx, cy, r1, r2, arc.startAngle, arc.endAngle)}
                  fill={arc.color}
                  fillOpacity={isDimmed ? 0.15 : 1}
                  style={{ transition: "fill-opacity 150ms, d 150ms" }}
                />
                {showSliceLabel && (
                  <>
                    <text x={lx} y={ly - 5} textAnchor="middle" fill="#fff" fontSize={10} fontFamily={T.font} fontWeight={600} style={{ pointerEvents: "none" }}>
                      {arc.name.length > 14 ? arc.name.slice(0, 12) + "..." : arc.name}
                    </text>
                    <text x={lx} y={ly + 7} textAnchor="middle" fill="rgba(255,255,255,0.8)" fontSize={9} fontFamily={T.mono} style={{ pointerEvents: "none" }}>
                      {pct}%
                    </text>
                  </>
                )}
                {showExtLabel && (
                  <text x={elx} y={ely} textAnchor={arc.midAngle > -Math.PI / 2 && arc.midAngle < Math.PI / 2 ? "start" : "end"} fill={T.fgMuted} fontSize={9} fontFamily={T.font} style={{ pointerEvents: "none" }} dominantBaseline="middle">
                    {arc.name.length > 16 ? arc.name.slice(0, 14) + "..." : arc.name} ({pct}%)
                  </text>
                )}
              </g>
            );
          })}
          {/* Center label */}
          <circle cx={cx} cy={cy} r={innerR - 4} fill={T.card} />
          <text x={cx} y={cy - 8} textAnchor="middle" fill={T.fg} fontSize={14} fontFamily={T.font} fontWeight={700}>
            {hoveredLabel
              ? (data.find(d => d.name === hoveredLabel)?.name.slice(0, 12) || "")
              : fmtNum(total)}
          </text>
          <text x={cx} y={cy + 8} textAnchor="middle" fill={T.fgMuted} fontSize={10} fontFamily={T.font}>
            {hoveredLabel
              ? `${total > 0 ? ((data.find(d => d.name === hoveredLabel)?.value ?? 0) / total * 100).toFixed(1) : 0}%`
              : aggLabels[agg] ?? agg}
          </text>
        </svg>
      </div>
      {/* Legend */}
      <div style={{ width: 200, flexShrink: 0, borderLeft: `1px solid ${T.border}`, display: "flex", flexDirection: "column", overflow: "hidden" }}>
        <div style={{ display: "flex", justifyContent: "space-between", padding: "8px 10px", borderBottom: `1px solid ${T.border}` }}>
          <span style={{ fontFamily: T.font, fontSize: T.textLabel, fontWeight: 600, color: T.fgMuted }}>Name</span>
          <span style={{ fontFamily: T.font, fontSize: T.textLabel, fontWeight: 600, color: T.fgMuted }}>Value</span>
        </div>
        <div style={{ overflowY: "auto", flex: 1 }}>
          {data.map((d, i) => {
            const pct = total > 0 ? ((d.value / total) * 100).toFixed(1) : 0;
            const isHovered = hoveredLabel === d.name;
            const isDimmed = hoveredLabel && !isHovered;
            return (
              <div key={i}
                onMouseEnter={() => setHoveredLabel(d.name)}
                onMouseLeave={() => setHoveredLabel(null)}
                style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "6px 10px", gap: 6, borderBottom: `1px solid ${T.border}`, cursor: "pointer", backgroundColor: isHovered ? T.muted : "transparent", opacity: isDimmed ? 0.35 : 1, transition: "opacity 150ms, background-color 100ms" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 6, minWidth: 0, flex: 1 }}>
                  <span style={{ width: 10, height: 10, borderRadius: "50%", backgroundColor: d.color, flexShrink: 0 }} />
                  <span style={{ fontFamily: T.font, fontSize: T.textLabel, color: T.fg, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{d.name}</span>
                </div>
